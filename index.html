<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Letter Quick</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Inter's capital I is a bare vertical bar, indistinguishable from L
         * in the grid. Override just U+0049 with a serif font that has top
         * and bottom bars; every other character falls through to Inter. */
        @font-face {
            font-family: 'CapI-Serif';
            src: local('Georgia'), local('Times New Roman'), local('Times'), local('serif');
            unicode-range: U+0049;
        }
        * {
            box-sizing: border-box;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
        }
        body, button, textarea, .FullscreenModal {
            font-family: 'CapI-Serif', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            font-size: 12px;
        }
        body, .FullscreenModal {
            background: transparent!important;
            color: hsl(0, 0%, 100%)!important;
        }
        html, body {
            overscroll-behavior: none;
        }
        body {
            margin: 0px;
            padding: 0px;
            position: fixed;
            inset: 0;
            overflow: hidden;
        }
        a:not(.Anchor), a:visited:not(.Anchor) {
            color: hsl(210, 75%, 65%);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="./browser.js" crossorigin="anonymous"></script>
</body>
</html>
